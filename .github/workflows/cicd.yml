
name: CI/CD Pipeline

# Run whenever code is pushed to main
on:
  push:
    branches:
      - main

# Azure login permissions
permissions:
  contents: read
  id-token: write

# Common variables
env:
  ACR_NAME: cicdkma2006
  ACR_LOGIN_SERVER: cicdkma2006.azurecr.io
  IMAGE_NAME: azure-cicd-java

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      #Download project code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Install Gitleaks
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # Scan Git repository history
      - name: Gitleaks security scan
        run: gitleaks git --redact --exit-code 2 .

      #Install Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      #Build and test Java application
      - name: Build and test
        run: mvn clean test package

      #Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      #Build and push Docker image
      - name: Build and push Docker image
        run: |
          az acr login --name $ACR_NAME

          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} .

          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      #Connect to AKS
      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group cicd-rg \
            --name cicd-aks

      #Deploy updated image
      - name: Deploy to AKS
        run: |
          kubectl set image deployment/azure-cicd-java \
            azure-cicd-java=$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

          kubectl rollout status deployment/azure-cicd-java --timeout=180s

      #Verify deployment
      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get services


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>Stopwatch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #f5f7ff;
            --muted: #aab5ca;
            --blue: #78aaff;
            --cyan: #75e0ee;
            --glass: rgba(255, 255, 255, 0.075);
            --border: rgba(255, 255, 255, 0.14);
        }

        body {
            min-height: 100vh;
            padding: 28px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont,
                "SF Pro Display", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 15% 15%, rgba(70, 111, 220, .32), transparent 38%),
                radial-gradient(ellipse at 85% 25%, rgba(25, 190, 205, .20), transparent 35%),
                radial-gradient(ellipse at 50% 100%, rgba(123, 74, 210, .22), transparent 42%),
                #0b1220;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .28;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            background: #367cff;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #13c7c9;
            bottom: -120px;
            right: -90px;
        }

        button {
            font: inherit;
        }

        .app {
            width: 100%;
            max-width: 850px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            font-size: 21px;
            background: linear-gradient(145deg, rgba(120,170,255,.35), rgba(117,224,238,.12));
            border: 1px solid var(--border);
            box-shadow: 0 8px 25px rgba(0,0,0,.18);
        }

        .brand-name {
            font-size: 17px;
            font-weight: 650;
            letter-spacing: .2px;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .version-pill {
            padding: 9px 13px;
            border: 1px solid rgba(120,170,255,.25);
            border-radius: 30px;
            background: rgba(75,130,230,.13);
            color: #b9d2ff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .glass {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(26px) saturate(165%);
            -webkit-backdrop-filter: blur(26px) saturate(165%);
            box-shadow:
                0 24px 70px rgba(0,0,0,.22),
                inset 0 1px 0 rgba(255,255,255,.08);
        }

        .main-card {
            position: relative;
            overflow: hidden;
            padding: 38px 34px 32px;
            border-radius: 32px;
        }

        .main-card::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            top: -180px;
            right: -80px;
            border-radius: 50%;
            background: rgba(87,150,255,.18);
            filter: blur(50px);
            pointer-events: none;
        }

        .section-heading {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--cyan);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(25px, 5vw, 35px);
            font-weight: 650;
            letter-spacing: -1.2px;
        }

        .description {
            margin-top: 9px;
            color: var(--muted);
            font-size: 13px;
        }

        .timer-panel {
            position: relative;
            padding: 36px 15px;
            border-radius: 25px;
            text-align: center;
            background: linear-gradient(
                145deg,
                rgba(255,255,255,.075),
                rgba(255,255,255,.025)
            );
            border: 1px solid rgba(255,255,255,.10);
        }

        .timer-label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 2.5px;
            margin-bottom: 17px;
        }

        .timer {
            font-variant-numeric: tabular-nums;
            font-size: clamp(43px, 10vw, 76px);
            line-height: 1.1;
            font-weight: 300;
            letter-spacing: -3px;
            white-space: nowrap;
            text-shadow: 0 0 35px rgba(120,170,255,.15);
        }

        .timer .milliseconds {
            color: #91baff;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 22px;
            padding: 8px 13px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(255,255,255,.045);
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #9aa8bd;
        }

        .status.running {
            color: #9cf1d0;
            border-color: rgba(83,224,166,.25);
        }

        .status.running .status-dot {
            background: #55e3a4;
            box-shadow: 0 0 12px #55e3a4;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% { opacity: .35; }
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 13px;
            margin: 28px 0 30px;
            flex-wrap: wrap;
        }

        .control-btn {
            min-width: 118px;
            padding: 15px 22px;
            border-radius: 17px;
            border: 1px solid var(--border);
            color: var(--text);
            background: rgba(255,255,255,.075);
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
            transition: transform .2s, background .2s, opacity .2s;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(255,255,255,.14);
        }

        .control-btn:active:not(:disabled) {
            transform: scale(.97);
        }

        .control-btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .primary-btn {
            color: #071426;
            background: linear-gradient(135deg, #a7caff, #6fe0eb);
            border: none;
            box-shadow: 0 9px 25px rgba(83,169,238,.22);
        }

        .primary-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #c2dbff, #8af0f5);
        }

        .lap-btn {
            color: #c4d9ff;
        }

        .reset-btn {
            color: #ffb8c2;
        }

        .lap-section {
            position: relative;
            border-top: 1px solid rgba(255,255,255,.10);
            padding-top: 25px;
        }

        .lap-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .lap-heading h2 {
            font-size: 14px;
            font-weight: 650;
        }

        .lap-count {
            color: var(--muted);
            font-size: 11px;
        }

        .lap-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
            max-height: 235px;
            overflow-y: auto;
        }

        .lap-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.065);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        .lap-row.header-row {
            padding: 5px 16px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .lap-row span:nth-child(2) {
            text-align: center;
        }

        .lap-row span:nth-child(3) {
            text-align: right;
        }

        .lap-number {
            color: #a9c9ff;
            font-weight: 650;
        }

        .lap-time {
            color: var(--text);
        }

        .lap-split {
            color: var(--cyan);
        }

        .empty-state {
            padding: 25px 10px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: rgba(210,220,240,.48);
            font-size: 10px;
            letter-spacing: 1.5px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(20,31,49,.92);
            color: #fff;
            font-size: 12px;
            backdrop-filter: blur(20px);
            transition: .25s ease;
            z-index: 5;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        button:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 4px;
        }

        @media (max-width: 560px) {
            body {
                padding: 18px 12px;
                align-items: flex-start;
            }

            .topbar {
                margin-bottom: 18px;
            }

            .main-card {
                padding: 27px 17px 23px;
                border-radius: 25px;
            }

            .timer-panel {
                padding: 34px 8px;
            }

            .timer {
                letter-spacing: -2px;
            }

            .controls {
                gap: 9px;
            }

            .control-btn {
                min-width: 0;
                flex: 1;
                padding: 14px 10px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-transparency: reduce) {
            .glass {
                background: #182438;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="app">

        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">◷</div>
                <div>
                    <div class="brand-name">Stopwatch</div>
                    <div class="brand-subtitle">Precision timer</div>
                </div>
            </div>

            <div class="version-pill" id="versionBadge">
                VERSION 1.0
            </div>
        </header>

        <section class="main-card glass">

            <div class="section-heading">
                <div class="eyebrow">Time your moments</div>
                <h1>Every second counts.</h1>
                <p class="description">
                    A simple space to measure your progress.
                </p>
            </div>

            <div class="timer-panel">
                <div class="timer-label">ELAPSED TIME</div>

                <div class="timer" aria-live="off">
                    <span id="minutes">00</span>:<span id="seconds">00</span><span class="milliseconds">.<span id="centiseconds">00</span></span>
                </div>

                <div class="status" id="status">
                    <span class="status-dot"></span>
                    <span id="statusText">READY</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn primary-btn" id="startBtn"
                        onclick="startStopwatch()">
                    ▶ Start
                </button>

                <button class="control-btn lap-btn" id="lapBtn"
                        onclick="recordLap()" disabled>
                    ◷ Lap
                </button>

                <button class="control-btn reset-btn" id="resetBtn"
                        onclick="resetStopwatch()">
                    ↺ Reset
                </button>
            </div>

            <section class="lap-section">
                <div class="lap-heading">
                    <h2>Lap history</h2>
                    <span class="lap-count" id="lapCount">0 LAPS</span>
                </div>

                <div class="lap-row header-row">
                    <span>Lap</span>
                    <span>Total time</span>
                    <span>Split</span>
                </div>

                <div class="lap-list" id="lapList">
                    <div class="empty-state">
                        Your recorded laps will appear here.
                    </div>
                </div>
            </section>

        </section>

        <footer class="footer" id="footer">
            JAVA 17 · SPRING BOOT · VERSION 1.0
        </footer>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        /*
         * ==========================================
         * APPLICATION VERSION
         * Change this value to demonstrate CI/CD.
         * Example: "1.0" -> "2.0"
         * ==========================================
         */
        const APP_VERSION = "1.0";

        document.getElementById("versionBadge").textContent =
            "VERSION " + APP_VERSION;

        document.getElementById("footer").textContent =
            "JAVA 17 · SPRING BOOT · VERSION " + APP_VERSION;


        /*
         * ==========================================
         * STOPWATCH BACKEND CONNECTION
         * Spring Boot REST API endpoints
         * ==========================================
         */
        const API = "/api/stopwatch";

        let elapsedMs = 0;
        let running = false;
        let laps = [];
        let lastLapTime = 0;

        // Local animation keeps the display smooth.
        // The backend remains the source of stopwatch state.
        let localStartTime = 0;
        let animationFrame = null;
        let toastTimeout = null;


        function currentElapsed() {
            if (running) {
                return elapsedMs + (performance.now() - localStartTime);
            }

            return elapsedMs;
        }


        function formatTime(milliseconds) {
            const totalCentiseconds = Math.floor(milliseconds / 10);

            const minutes = Math.floor(totalCentiseconds / 6000);
            const seconds = Math.floor((totalCentiseconds % 6000) / 100);
            const centiseconds = totalCentiseconds % 100;

            return {
                minutes: String(minutes).padStart(2, "0"),
                seconds: String(seconds).padStart(2, "0"),
                centiseconds: String(centiseconds).padStart(2, "0")
            };
        }


        function updateDisplay() {
            const time = formatTime(currentElapsed());

            document.getElementById("minutes").textContent = time.minutes;
            document.getElementById("seconds").textContent = time.seconds;
            document.getElementById("centiseconds").textContent =
                time.centiseconds;

            animationFrame = requestAnimationFrame(updateDisplay);
        }


        function startDisplay() {
            if (animationFrame === null) {
                animationFrame = requestAnimationFrame(updateDisplay);
            }
        }


        function stopDisplay() {
            if (animationFrame !== null) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            updateDisplayOnce();
        }


        function updateDisplayOnce() {
            const time = formatTime(currentElapsed());

            document.getElementById("minutes").textContent = time.minutes;
            document.getElementById("seconds").textContent = time.seconds;
            document.getElementById("centiseconds").textContent =
                time.centiseconds;
        }


        function updateControls() {
            const startBtn = document.getElementById("startBtn");
            const lapBtn = document.getElementById("lapBtn");
            const status = document.getElementById("status");
            const statusText = document.getElementById("statusText");

            if (running) {
                startBtn.textContent = "Ⅱ Pause";
                status.classList.add("running");
                statusText.textContent = "RUNNING";
                lapBtn.disabled = false;
            } else {
                startBtn.textContent =
                    elapsedMs > 0 ? "▶ Resume" : "▶ Start";

                status.classList.remove("running");
                statusText.textContent =
                    elapsedMs > 0 ? "PAUSED" : "READY";

                lapBtn.disabled = true;
            }
        }


        function renderLaps() {
            const lapList = document.getElementById("lapList");
            const lapCount = document.getElementById("lapCount");

            lapCount.textContent =
                laps.length + (laps.length === 1 ? " LAP" : " LAPS");

            if (laps.length === 0) {
                lapList.innerHTML = `
                    <div class="empty-state">
                        Your recorded laps will appear here.
                    </div>
                `;
                lastLapTime = 0;
                return;
            }

            lapList.innerHTML = "";

            // Newest lap appears first.
            [...laps].reverse().forEach((lap) => {
                const total = Number(lap.elapsedMs);
                const split = total - lastLapTime;

                const row = document.createElement("div");
                row.className = "lap-row";

                const number = document.createElement("span");
                number.className = "lap-number";
                number.textContent =
                    "LAP " + String(lap.lapNumber).padStart(2, "0");

                const totalTime = document.createElement("span");
                totalTime.className = "lap-time";
                totalTime.textContent = formatLapTime(total);

                const splitTime = document.createElement("span");
                splitTime.className = "lap-split";
                splitTime.textContent = "+" + formatLapTime(split);

                row.append(number, totalTime, splitTime);
                lapList.appendChild(row);

                lastLapTime = total;
            });
        }


        function formatLapTime(milliseconds) {
            const time = formatTime(milliseconds);

            return time.minutes + ":" + time.seconds + "." +
                time.centiseconds;
        }


        async function apiRequest(endpoint, method = "GET") {
            const response = await fetch(API + endpoint, {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                }
            });

            if (!response.ok) {
                let message = "Request failed. Please try again.";

                try {
                    const error = await response.json();
                    message = error.message || message;
                } catch (_) {
                    // Keep the default error message.
                }

                throw new Error(message);
            }

            return response.json();
        }


        function applyState(state) {
            elapsedMs = Number(state.elapsedMs) || 0;
            running = Boolean(state.running);
            laps = Array.isArray(state.laps) ? state.laps : [];

            if (running) {
                localStartTime = performance.now();
                startDisplay();
            } else {
                stopDisplay();
            }

            updateControls();
            renderLaps();
        }


        async function startStopwatch() {
            const button = document.getElementById("startBtn");
            button.disabled = true;

            try {
                const endpoint = running ? "/pause" : "/start";
                const state = await apiRequest(endpoint, "POST");
                applyState(state);
            } catch (error) {
                showToast(error.message);
            } finally {
                button.disabled = false;
            }
        }


        async function recordLap() {
            if (!running) return;

            const button = document.getElementById("lapBtn");
            button.disabled = true;

            try {
                await apiRequest("/lap", "POST");

                const state = await apiRequest("");
                applyState(state);
                showToast("Lap recorded");
            } catch (error) {
                showToast(error.message);
            } finally {
                button.disabled = !running;
            }
        }


        async function resetStopwatch() {
            const button = document.getElementById("resetBtn");
            button.disabled = true;

            try {
                const state = await apiRequest("/reset", "POST");
                applyState(state);
                showToast("Stopwatch reset");
            } catch (error) {
                showToast(error.message);
            } finally {
                button.disabled = false;
            }
        }


        function showToast(message) {
            const toast = document.getElementById("toast");

            toast.textContent = message;
            toast.classList.add("show");

            clearTimeout(toastTimeout);

            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 2200);
        }


        async function loadStopwatch() {
            try {
                const state = await apiRequest("");
                applyState(state);
            } catch (error) {
                showToast("Cannot connect to stopwatch server");
                console.error(error);
            }
        }


        // Load the current backend state when the page opens.
        loadStopwatch();
    </script>
</body>
</html>
